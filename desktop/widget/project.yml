# XcodeGen spec for the Clockwize WidgetKit extension + reload helper.
# Do not run xcodegen here (the repo lives in iCloud Drive) - build.sh copies this
# folder to $TMPDIR and generates/builds there. Signing is done by build.sh, not Xcode.
name: ClockwizeWidget
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: he
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_HARDENED_RUNTIME: "YES"
    DEAD_CODE_STRIPPING: "YES"
    # Overridden on the xcodebuild command line by build.sh.
    CLOCKWIZE_WIDGET_PORT: "47321"
    CLOCKWIZE_WIDGET_SECRET: ""
    CLOCKWIZE_WIDGET_BUNDLE_ID: com.yairix.clockwize.widget
    # The reload helper must present the host app's bundle id: chronod resolves
    # the caller by the CFBundleIdentifier embedded in the binary and only
    # reloads widgets whose container app has that id.
    CLOCKWIZE_HOST_BUNDLE_ID: com.yairix.clockwize
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ClockwizeWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/Widget
    settings:
      base:
        PRODUCT_NAME: ClockwizeWidget
        PRODUCT_BUNDLE_IDENTIFIER: $(CLOCKWIZE_WIDGET_BUNDLE_ID)
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        SKIP_INSTALL: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
  clockwize-widget-reload:
    type: tool
    platform: macOS
    sources:
      - path: Sources/Reload
    settings:
      base:
        PRODUCT_NAME: clockwize-widget-reload
        PRODUCT_BUNDLE_IDENTIFIER: $(CLOCKWIZE_HOST_BUNDLE_ID)
        INFOPLIST_FILE: Reload-Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CREATE_INFOPLIST_SECTION_IN_BINARY: "YES"
        SKIP_INSTALL: "YES"
    dependencies:
      - sdk: WidgetKit.framework
schemes:
  ClockwizeWidget:
    build:
      targets:
        ClockwizeWidget: all
        clockwize-widget-reload: all
