<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:">
  <title>Clockwize</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #6366f1;
      --error: #f87171;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 30% 20%, rgba(99, 102, 241, 0.12), transparent 55%), var(--bg);
      color: var(--text);
      font: 15px/1.6 -apple-system, BlinkMacSystemFont, 'Heebo', sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }
    main { width: min(440px, 90vw); text-align: center; }
    .logo { width: 88px; height: 88px; margin: 0 auto 20px; border-radius: 22px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45); }
    h1 { margin: 0 0 6px; font-size: 22px; font-weight: 600; letter-spacing: 0.2px; }
    p { margin: 0; color: var(--muted); }
    .spinner {
      width: 22px; height: 22px; margin: 22px auto 0;
      border: 2.5px solid rgba(148, 163, 184, 0.25); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { display: none; margin-top: 22px; padding: 16px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; text-align: right; }
    .error strong { display: block; color: var(--error); margin-bottom: 6px; }
    pre { max-height: 160px; overflow: auto; margin: 10px 0 0; padding: 10px; background: var(--bg); border-radius: 8px; color: var(--muted); font: 12px/1.5 ui-monospace, Menlo, monospace; direction: ltr; text-align: left; white-space: pre-wrap; -webkit-user-select: text; user-select: text; }
    .actions { display: flex; gap: 8px; justify-content: flex-start; margin-top: 14px; flex-wrap: wrap; }
    button { font: inherit; font-size: 14px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text); cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); }
    button:hover { filter: brightness(1.15); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    body.failed .spinner, body.locked-state .spinner { display: none; }
    .locked { margin-top: 18px; }
    body.failed .error { display: block; }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="assets/icon.png" alt="">
    <h1>Clockwize</h1>
    <p id="status">מפעיל את Clockwize…</p>
    <div class="spinner" role="progressbar" aria-label="טוען"></div>
    <section class="locked" hidden>
      <p>Clockwize נעול. אשרו עם Touch ID כדי להמשיך.</p>
      <div class="actions" style="justify-content:center">
        <button class="primary" id="unlock">פתח עם Touch ID</button>
      </div>
    </section>
    <section class="error" role="alert">
      <strong id="error-title"></strong>
      <p>אפשר לנסות שוב, או לפתוח את קובץ הלוג כדי לראות מה קרה.</p>
      <pre id="details" hidden></pre>
      <div class="actions">
        <button class="primary" id="retry">נסה שוב</button>
        <button id="choose" hidden>בחר תיקיית פרויקט…</button>
        <button id="logs">פתח לוג</button>
      </div>
    </section>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const error = params.get('error');
    const bridge = window.clockwizeDesktop;
    if (params.get('locked') === '1') {
      document.body.classList.add('locked-state');
      document.getElementById('status').textContent = 'נעול';
      document.querySelector('.locked').hidden = false;
      document.getElementById('unlock').addEventListener('click', () => bridge?.unlock());
    }
    if (error) {
      document.body.classList.add('failed');
      document.getElementById('status').textContent = 'ההפעלה לא הצליחה';
      document.getElementById('error-title').textContent = error;
      const details = params.get('details');
      if (details) {
        const pre = document.getElementById('details');
        pre.textContent = details;
        pre.hidden = false;
      }
      document.getElementById('choose').hidden = params.get('canChoose') !== '1';
    }
    document.getElementById('retry').addEventListener('click', () => bridge?.retry());
    document.getElementById('choose').addEventListener('click', () => bridge?.chooseFolder());
    document.getElementById('logs').addEventListener('click', () => bridge?.openLogs());
  </script>
</body>
</html>
