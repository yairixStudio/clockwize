<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243049"/>
      <stop offset="1" stop-color="#0d1322"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Big Sur style: 824px squircle centered on a transparent 1024 canvas -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <g transform="translate(100,100) scale(0.8046875)">
    <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#glow)"/>
    <rect x="7" y="7" width="1010" height="1010" rx="226" fill="none" stroke="#818cf8" stroke-opacity="0.22" stroke-width="6"/>

    <circle cx="512" cy="512" r="300" fill="#0f172a" fill-opacity="0.45"/>
    <circle cx="512" cy="512" r="300" fill="none" stroke="url(#ring)" stroke-width="52"/>

    <line x1="512" y1="512" x2="512" y2="318" stroke="#eef2ff" stroke-width="48" stroke-linecap="round"/>
    <line x1="512" y1="512" x2="668" y2="512" stroke="#a5b4fc" stroke-width="44" stroke-linecap="round"/>

    <circle cx="512" cy="512" r="34" fill="#818cf8"/>
    <circle cx="512" cy="512" r="14" fill="#0d1322"/>
  </g>
</svg>
